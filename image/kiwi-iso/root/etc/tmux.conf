# Akilix tmux defaults. User settings in ~/.tmux.conf may override these.
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on

set -g status-style 'bg=#0b1114,fg=#e8e6dd'
set -g message-style 'bg=#657a3e,fg=#e8e6dd'
set -g pane-active-border-style 'fg=#8ead55'
set -g pane-border-style 'fg=#4a5358'
